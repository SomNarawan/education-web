# kukps-eng-education-ssd-public - the student site, deployed at
# https://eng.kps.ku.ac.th/kukps-eng-education-ssd-public/
#
#   docker compose -f docker-compose.public.yml up -d --build
#
# The API, database and staff site run on office.eng.kps.ku.ac.th
# (docker-compose.yml in education-api). The browser calls this site's own
# <base path>/api/*, and nginx forwards it to API_UPSTREAM.
#
# Settings below can be overridden from the shell or an env file
# (docker compose --env-file ...). Local test against the API on this machine:
#   docker compose -f docker-compose.public.yml --env-file .env.localdeploy up -d --build

name: kukps-eng-education-ssd-public

services:
  # VITE_* is baked in at build time. Keep the API URL under the base path, so
  # the reverse proxy in front only has to forward that one prefix here.
  web-public:
    image: kukps-eng-education-ssd-web-public:latest
    build:
      context: .
      args:
        VITE_APP_MODE: student
        VITE_BASE_PATH: ${WEB_PUBLIC_BASE_PATH:-/kukps-eng-education-ssd-public}
        VITE_API_URL: ${WEB_PUBLIC_BASE_PATH:-/kukps-eng-education-ssd-public}/api
        # TODO: set to false once real SSO is wired up
        VITE_MOCK_LOGIN_ENABLED: ${WEB_PUBLIC_MOCK_LOGIN_ENABLED:-true}
    container_name: kukps-eng-education-ssd-web-public
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${WEB_PUBLIC_API_UPSTREAM:-https://office.eng.kps.ku.ac.th/kukps-eng-education-ssd-api}
    ports:
      - "${WEB_PUBLIC_EXTERNAL_PORT:-3007}:3007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
